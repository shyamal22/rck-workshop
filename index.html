<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RCK Workshop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="topbar">
  <button id="backBtn" class="icon-btn" hidden aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
  </button>
  <button id="homeBtn" class="icon-btn" hidden aria-label="Costs or maintenance">
    <svg viewBox="0 0 24 24"><path d="M4 11.2L12 4.5l8 6.7"/><path d="M6.2 10v9.5h11.6V10"/></svg>
  </button>
  <div class="brand">
    <strong id="title">Gear</strong>
    <span id="syncDot" class="dot" title="Connection"></span>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>
    </svg>
  </button>
</header>

<nav id="menu" hidden>
  <button data-go="#/">Costs or maintenance</button>
  <hr>
  <button data-go="#/gear">Gear board</button>
  <button data-go="#/orders">Work orders</button>
  <button data-go="#/report">Report damage</button>
  <button data-go="#/reports">Reports</button>
  <button data-go="#/screen">Workshop screen</button>
  <hr>
  <button data-go="#/crew">Maintenance crew</button>
  <button data-go="#/costs">Costs</button>
  <button data-go="#/costs/summary">Cost tracker</button>
  <hr>
  <button data-go="#/gearadmin">Manage gear</button>
  <button data-go="#/setup">Settings</button>
</nav>

<main id="view"></main>

<nav id="tabbar" hidden></nav>

<div id="printArea" aria-hidden="true"></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
