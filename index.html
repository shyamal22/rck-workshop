<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RCK Workshop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="topbar">
  <button id="backBtn" class="icon-btn" hidden aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="brand">
    <strong id="title">Gear</strong>
    <span id="syncDot" class="dot" title="Connection"></span>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>
    </svg>
  </button>
</header>

<nav id="menu" hidden>
  <button data-go="#/">Gear board</button>
  <button data-go="#/orders">Work orders</button>
  <button data-go="#/report">Report damage</button>
  <button data-go="#/reports">Reports</button>
  <button data-go="#/screen">Workshop screen</button>
  <hr>
  <button data-go="#/gearadmin">Manage gear</button>
  <button data-go="#/setup">Settings</button>
</nav>

<main id="view"></main>

<nav id="tabbar">
  <a href="#/" data-tab="board">
    <svg viewBox="0 0 24 24"><rect x="3.75" y="3.75" width="6.5" height="6.5" rx="2"/><rect x="13.75" y="3.75" width="6.5" height="6.5" rx="2"/><rect x="3.75" y="13.75" width="6.5" height="6.5" rx="2"/><rect x="13.75" y="13.75" width="6.5" height="6.5" rx="2"/></svg>
    <span>Gear</span>
  </a>
  <a href="#/orders" data-tab="orders">
    <svg viewBox="0 0 24 24"><path d="M8 4h8a2 2 0 0 1 2 2v13.1a1 1 0 0 1-1.47.88L12 17.4l-4.53 2.58A1 1 0 0 1 6 19.1V6a2 2 0 0 1 2-2z"/><path d="M9.25 8.5h5.5"/></svg>
    <span>Work orders</span>
  </a>
  <a href="#/report" data-tab="report" class="tab-primary">
    <span class="fab"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
    <span>Report</span>
  </a>
</nav>

<div id="printArea" aria-hidden="true"></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
