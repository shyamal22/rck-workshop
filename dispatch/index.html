<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>RCK Dispatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=2.2.0">
</head>
<body>

<header id="topbar">
  <button id="backBtn" class="icon-btn" hidden aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="brand">
    <strong id="title">Jobs</strong>
    <span id="syncDot" class="dot" title="Connection"></span>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>
    </svg>
  </button>
</header>

<nav id="menu" hidden>
  <button data-go="#/">Home</button>
  <button data-go="#/jobs">Jobs</button>
  <button data-go="#/today">Today on site</button>
  <button data-go="#/new">New job</button>
  <button data-go="#/reports">Reports</button>
  <button data-go="#/pnl" data-role="director">Profit &amp; loss</button>
  <button data-go="#/screen">Office screen</button>
  <hr>
  <button data-go="#/setup">Settings</button>
</nav>

<main id="view"></main>

<nav id="tabbar">
  <a href="#/jobs" data-tab="board">
    <svg viewBox="0 0 24 24"><rect x="3.75" y="3.75" width="6.5" height="6.5" rx="2"/><rect x="13.75" y="3.75" width="6.5" height="6.5" rx="2"/><rect x="3.75" y="13.75" width="6.5" height="6.5" rx="2"/><rect x="13.75" y="13.75" width="6.5" height="6.5" rx="2"/></svg>
    <span>Jobs</span>
  </a>
  <a href="#/today" data-tab="today">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
    <span>Today</span>
  </a>
  <a href="#/new" data-tab="new" class="tab-primary">
    <span class="fab"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
    <span>New job</span>
  </a>
</nav>

<div id="printArea" aria-hidden="true"></div>
<div id="toast" hidden></div>

<!-- The ?v= must be bumped with VERSION in app.js. It is what makes a
     deploy reach a phone: these URLs have never been cached before, so
     no stale copy of the app can be served in their place. -->
<script src="config.js?v=2.2.0"></script>
<script src="app.js?v=2.2.0"></script>
</body>
</html>
