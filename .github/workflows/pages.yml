# Builds workshop-v2 and publishes the whole site to GitHub Pages:
# the v1 apps straight from the repository root, and v2 built into
# /workshop-v2/. Pages must be set to "Source: GitHub Actions" once.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workshop-v2/package-lock.json
      - name: Build v2
        working-directory: workshop-v2
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude workshop-v2 --exclude _site ./ _site/
          mkdir -p _site/workshop-v2
          cp -r workshop-v2/dist/. _site/workshop-v2/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
